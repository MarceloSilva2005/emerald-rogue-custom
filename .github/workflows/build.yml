name: CI

on:
  push:
    branches:
      - vanilla
      - vanilla-dev
      - expansion
      - expansion-dev
      - feature/innates
  pull_request:
    branches:
      - vanilla
      - vanilla-dev
      - expansion
      - expansion-dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/innates'
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 1
      COMPARE: 0
      RELEASE: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev
          ./init_deps.sh

      - name: Build Test ROM
        run: make -j$(nproc) -O all

      - name: Upload Test ROM
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Rogue-Test-ROM
          path: pokeemerald.gba
          retention-days: 7

  build:
    if: github.ref != 'refs/heads/feature/innates' && github.head_ref != 'feature/innates'
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev

      - name: Install Dependencies
        run: |
          ./init_deps.sh

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Build Debug
        env:
          MODERN: 1
          COMPARE: 0
          RELEASE: 0
        run: make -j$(nproc) -O all

      - name: Build Release
        env:
          MODERN: 1
          COMPARE: 0
          RELEASE: 1
        run: make -j$(nproc) -O all

      - name: Update Memory Stats
        uses: actions/upload-artifact@v4
        with:
          name: Memory Stats
          path: pokeemerald_memorystats.csv

      - name: Test
        env:
          MODERN: 1
          TEST: 1
        run: |
          make -j$(nproc) -O pokeemerald-test.elf
          make -j$(nproc) check
